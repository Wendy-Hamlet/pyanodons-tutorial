[mod-name]
py-tutorial-companion=Py 教程助手

[mod-description]
py-tutorial-companion=把 Py 教程的蓝图书放到你手上，导出手持的蓝图书或蓝图，并记录游戏过程，供教程工具使用。

[shortcut-name]
pt-import-book=教程蓝图书
pt-export-held=导出手持蓝图

[mod-setting-name]
pt-recorder-enabled=记录游戏过程
pt-recorder-segment-mb=记录分段大小（MB）
pt-recorder-keep-segments=保留的记录分段数

[mod-setting-description]
pt-recorder-enabled=把研究、聊天、建造活动和产量写入 script-output/py-tutorial-companion/recorder/，供教程工具读取。
pt-recorder-segment-mb=当前活动日志文件再写就会超过这个大小时，换一个新文件。
pt-recorder-keep-segments=更早的活动日志文件会被删除。总大小上限 = 分段大小 × 保留段数。时间线文件（研究、聊天）很小，始终保留。

[py-tutorial-companion]
command-book=把教程蓝图书放到你手上（单人游戏中会先重新载入模组脚本，以读到最新推送的蓝图）。
command-export=把手持的蓝图书或蓝图导出到 script-output，供 tools/bp-sync.js 读取。
imported=教程蓝图书已在手上：共 __1__ 张蓝图，生成于 __2__。
import-warnings=书中有部分实体在本游戏中不存在，已被略去。
import-failed=无法导入教程蓝图书。
no-book=还没有蓝图书：请在教程目录运行 "node tools/bp-sync.js push"。
cursor-busy=无法清空手上的物品（背包是否已满？）。
nothing-held=请先拿起一本蓝图书或一张蓝图（来自背包或蓝图库都可以）。
exported=已将"__1__"导出到 script-output/__2__。
export-failed=导出失败：__1__
command-shots=按 tools/shots.js 写好的清单截图（单人游戏中会先重新载入模组脚本）。
no-shots=还没有截图清单：请在教程目录运行 "node tools/shots.js plan"。
shots-taken=已截图 __1__ 张（清单生成于 __2__），在 script-output/py-tutorial-companion/shots。
command-fp=把你在 Factory Planner 里打开的工厂写到 script-output，供 tools/planner-summary.js 读取。
fp-missing=没有加载 Factory Planner。
fp-none=请先在 Factory Planner 里打开一个工厂。
fp-written=工厂"__1__"（__2__ 条产线）已写到 script-output/__3__。
