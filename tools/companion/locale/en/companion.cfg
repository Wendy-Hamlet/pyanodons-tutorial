[mod-name]
py-tutorial-companion=Py tutorial companion

[mod-description]
py-tutorial-companion=Puts the Py tutorial's blueprint book into your cursor, exports a held book or blueprint, and records the game as it is played, for the tutorial's tools.

[shortcut-name]
pt-import-book=Tutorial blueprint book
pt-export-held=Export held blueprint

[mod-setting-name]
pt-recorder-enabled=Record the game
pt-recorder-segment-mb=Recorder segment size (MB)
pt-recorder-keep-segments=Recorder segments kept

[mod-setting-description]
pt-recorder-enabled=Writes research, chat, building activity and production to script-output/py-tutorial-companion/recorder/ for the tutorial's tools.
pt-recorder-segment-mb=The activity log starts a new file when the current one would grow past this size.
pt-recorder-keep-segments=Older activity files are deleted. Size cap = segment size x segments kept. The timeline file (research, chat) is small and always kept.

[py-tutorial-companion]
command-book=Puts the tutorial's blueprint book into your cursor (in single player the mod scripts are reloaded first, to pick up a fresh push).
command-export=Exports the held blueprint book or blueprint to script-output for tools/bp-sync.js.
imported=Tutorial book in your cursor: __1__ blueprints, built __2__.
import-warnings=Some entities in the book are unknown to this game and were left out.
import-failed=The tutorial book could not be imported.
no-book=No book yet: run "node tools/bp-sync.js push" in the tutorial folder.
cursor-busy=Could not empty the cursor (is the inventory full?).
nothing-held=Hold a blueprint book or a blueprint first (from the inventory or the blueprint library).
exported=Exported "__1__" to script-output/__2__.
export-failed=Could not export: __1__
command-shots=Takes the screenshots listed by tools/shots.js (reloads the mod scripts first in single player).
no-shots=No screenshot list yet: run "node tools/shots.js plan" in the tutorial folder.
shots-taken=__1__ screenshots taken (list of __2__), in script-output/py-tutorial-companion/shots.
